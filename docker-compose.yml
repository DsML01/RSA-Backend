services:
  api:
    build: .
    container_name: rsa_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/rsa_project.db}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /data/uploads
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"

volumes:
  app_data:
